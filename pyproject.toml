[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmic-string-signals"
version = "0.1.0"
description = "Synthetic 3D signal detection and matched-filter extraction in noisy fields"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jeffrey Morais", email = "jeffrey.morais@mail.mcgill.ca"},
]
keywords = [
    "signal-processing",
    "matched-filtering",
    "cosmology",
    "numerical-simulation",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "astropy>=5.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/IsolatedSingularity/Cosmic-String-Signals"
Repository = "https://github.com/IsolatedSingularity/Cosmic-String-Signals"
Issues = "https://github.com/IsolatedSingularity/Cosmic-String-Signals/issues"

[tool.setuptools.packages.find]
include = ["cosmic_string_signals*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
